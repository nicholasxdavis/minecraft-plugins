# LevelEnchant Configuration

# Enable/disable features
features:
  # Use LevelPlugin levels for enchanting instead of vanilla XP
  use-level-for-enchanting: true
  # Prevent crafting from consuming levels
  prevent-crafting-xp-loss: true
  # Display LevelPlugin level on XP bar
  display-level-on-xp-bar: true

# XP bar update interval (in ticks, 20 ticks = 1 second)
xp-bar-update-interval: 20

# Auto-save settings
# Auto-save interval in ticks (20 ticks = 1 second, default: 6000 ticks = 5 minutes)
auto-save-interval-ticks: 6000

# Messages
messages:
  prefix: "&e&lPandora"
  not-enough-level: "{prefix} &7You need to be level &6{required_level} &7to enchant this item. Your level: &6{player_level}"


