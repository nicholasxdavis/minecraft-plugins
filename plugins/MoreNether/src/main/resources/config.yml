# MoreNether Configuration

features:
  # Mob Behavior Tweaks
  wither-skeleton-behavior:
    enabled: true
    silent-until-blocks: 5
    stare-duration-ticks: 40  # 2 seconds
    pair-spawn-chance: 0.3  # 30%
  
  piglin-behavior:
    enabled: true
    gold-hold-hostile: true
    gold-drop-multiplier: 1.5  # +50%
    patrol-increase: 1.3  # +30% more patrols
  
  ghast-behavior:
    enabled: true
    faster-targeting: true
    double-fireball-chance: 0.1  # 10%
  
  enderman-behavior:
    enabled: true
    aggressive-teleport: true
    teleport-behind-chance: 0.3  # 30%
    hover-stare-ticks: 60  # 3 seconds
  
  # Spawn Rate Adjustments
  spawn-rates:
    enabled: true
    low-light-multiplier: 1.35  # +35% spawns at LL <= 5
    blaze-multiplier: 1.3  # +30%
    hoglin-pack-size: 1.4  # +40% pack size
    skeleton-valley-multiplier: 1.5  # +50%
  
  # Drop Rate Increases
  drop-rates:
    enabled: true
    blaze-rod-multiplier: 1.3  # +30%
    ghast-tear-multiplier: 1.25  # +25%
    wither-skull-multiplier: 1.15  # +15%
    quartz-multiplier: 1.4  # +40%
    gold-multiplier: 1.5  # +50%
    magma-cream-multiplier: 1.35  # +35%
    hoglin-drops-multiplier: 1.4  # +40%
  
  # World Features
  world-features:
    enabled: true
    gold-vein-increase: 1.3  # +30% more gold in bastions
    exposed-gold-chance: 0.15  # 15% chance per chunk
    bone-pile-clusters: true
  
  # Phase 2: Horror Systems
  horror-atmosphere:
    enabled: true
    darkness-pressure:
      enabled: true
      mob-spawn-multiplier: 1.35  # Already in Phase 1, enhance
      ghast-ambient-chance: 0.05  # 5% per check
      random-footsteps-chance: 0.03  # 3% per check
      check-interval-ticks: 40  # Check every 2 seconds
    soul-sand-valley-horror:
      enabled: true
      soul-moaning-interval-min: 100  # ticks
      soul-moaning-interval-max: 200  # ticks
      large-skeleton-patrol-size: 6  # 5-8 skeletons
      silent-valley-chance: 0.1  # 10% chance per visit
    heat-pressure:
      enabled: true
      basalt-deltas-hunger-multiplier: 1.3  # +30% faster
      check-interval-ticks: 20  # Check every second
  
  # Enhanced Stalker AI
  stalker-ai:
    enabled: true
    wither-skeleton:
      stare-duration-ticks: 60  # 3 seconds
      pair-spawn-chance: 0.3  # 30%
    piglin:
      instant-gold-detection: true
      gold-mining-aggro-radius: 16  # blocks
    ghast:
      fake-scream-chance: 0.05  # 5% chance
      double-fireball-chance: 0.1  # 10%
    enderman:
      teleport-behind-chance: 0.4  # 40% chance
      hover-stare-ticks: 60  # 3 seconds
  
  # Phase 3: Events & World Features
  events:
    enabled: true
    blaze-surge:
      enabled: true
      spawn-multiplier: 3.0  # 3x Blaze spawns
      duration-seconds: 60
      trigger-chance: 0.05  # 5% per check
      check-interval-seconds: 300  # Check every 5 minutes
      audio-cue: true
      rod-drop-multiplier: 1.5  # +50% during event
    soul-patrol:
      enabled: true
      patrol-size: 8  # 5-10 skeletons
      duration-seconds: 90
      trigger-chance: 0.03
      check-interval-seconds: 400
      bone-drop-multiplier: 2.0  # 2x bones/arrows
    gold-rush:
      enabled: true
      exposed-veins: true
      piglin-miners: true
      duration-seconds: 120
      trigger-chance: 0.02
      check-interval-seconds: 600
      gold-drop-multiplier: 3.0  # 3x gold
    hoglin-hunt:
      enabled: true
      pack-size: 12  # Big packs
      duration-seconds: 60
      trigger-chance: 0.04
      check-interval-seconds: 350
      drop-multiplier: 1.8  # +80%
  
  # High-Risk Zones
  high-risk-zones:
    enabled: true
    dangerous-chunks:
      enabled: true
      spawn-multiplier: 1.5  # +50%
      mob-speed-multiplier: 1.3  # +30%
      ghast-target-speed: 1.5  # +50%
      drop-multiplier: 1.2  # +20%
      chance-per-chunk: 0.1  # 10% of chunks
  
  # Phase 4: Advanced Mechanics
  advanced-ai:
    enabled: true
    wither-skeleton:
      predictive-positioning: true
      stalking-patterns: true
      coordinated-attacks: true
    piglin:
      advanced-gold-detection: true
      coordinated-attacks: true
    ghast:
      sniper-positioning: true
      rare-double-fireball: true
    hoglin:
      pack-hunting: true
      coordinated-charges: true
  
  # Dynamic Difficulty
  dynamic-difficulty:
    enabled: true
    scale-spawns: true
    scale-drops: true
    scale-speed: true
    max-multiplier: 2.5
  
  # Performance Optimization
  performance:
    enabled: true
    spawn-check-interval: 40  # ticks
    event-check-interval: 100  # ticks
    ai-update-interval: 10  # ticks
    cache-duration: 300  # ticks

# Plugin Integrations
integrations:
  levelplugin:
    enabled: true
    nether-xp-multiplier: 1.5  # 1.5x XP for kills in Nether
  levelledmobs:
    enabled: true
    apply-levels: true  # Apply LevelledMobs to spawned mobs
  quest-system:
    enabled: true  # Integrate with qab.sk quest system

