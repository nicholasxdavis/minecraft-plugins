# PandoraMiner Configuration

# Visual settings
visuals:
  prefix: "&e&lPandora &8» &r"
  header: "&e&l"
  highlight: "&6"
  text: "&7"
  error: "&c"
  special: "&e"

# Miner kit settings
miner-kit:
  # Armor settings
  helmet: GOLDEN_HELMET
  chestplate: GOLDEN_CHESTPLATE
  leggings: GOLDEN_LEGGINGS
  boots: GOLDEN_BOOTS
  armor-enchantment-level: 1
  
  # Pickaxe settings
  pickaxe: NETHERITE_PICKAXE
  pickaxe-enchantment-level: 5
  pickaxe-unbreakable: true
  
  # Potion effects
  potion-effects:
    haste:
      level: 1
      enabled: true
    invisibility:
      level: 0
      enabled: true
    speed:
      level: 1
      enabled: true
    fire-resistance:
      level: 0
      enabled: true

# Protection settings
protection:
  # Protect backpack items from being broken by miner pickaxe
  protect-backpack: true
  
  # Protect sell chests
  protect-sell-chests: true
  
  # Protect auction house chests
  protect-ah-chests: true
  
  # Protect base chests
  protect-base-chests: true
  
  # Protected block types (chests, barrels, etc.)
  protected-blocks:
    - CHEST
    - TRAPPED_CHEST
    - BARREL
    - SHULKER_BOX
    - BLACK_SHULKER_BOX
    - BLUE_SHULKER_BOX
    - BROWN_SHULKER_BOX
    - CYAN_SHULKER_BOX
    - GRAY_SHULKER_BOX
    - GREEN_SHULKER_BOX
    - LIGHT_BLUE_SHULKER_BOX
    - LIGHT_GRAY_SHULKER_BOX
    - LIME_SHULKER_BOX
    - MAGENTA_SHULKER_BOX
    - ORANGE_SHULKER_BOX
    - PINK_SHULKER_BOX
    - PURPLE_SHULKER_BOX
    - RED_SHULKER_BOX
    - WHITE_SHULKER_BOX
    - YELLOW_SHULKER_BOX

# Claim checking settings
claims:
  # Automatically disable miner mode when entering claimed land
  auto-disable-on-claim: true
  
  # Allow miner mode in wilderness
  allow-wilderness: true
  
  # Allow miner mode in own claimed land
  allow-own-claims: true

# Messages
messages:
  enabled: "&7Miner state &6enabled&7! Your inventory has been safely saved."
  disabled: "&7Miner state &6disabled&7! Your inventory has been restored."
  error-permission: "&cYou don't have permission to use this command!"
  error-claimed-land: "&cYou cannot enable miner mode in claimed land!"
  error-removed-claim: "&cMiner mode disabled! You entered claimed land."
  error-cannot-remove-armor: "&cYou cannot remove your miner armor! Use /miner to disable miner mode."
  error-cannot-drop-items: "&cYou cannot drop your miner items! Use /miner to disable miner mode."

# Auto-save settings
auto-save:
  # Auto-save saved inventories every X ticks (20 ticks = 1 second)
  interval: 1200


