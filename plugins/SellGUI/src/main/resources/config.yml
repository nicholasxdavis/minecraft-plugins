# SellGUI Configuration

# Messages
messages:
  prefix: "&ePandora"
  no-permission: "{prefix} &7You don't have permission to use this command."
  no-economy: "{prefix} &7Economy plugin not found! Please contact an administrator."
  sold-item: "{prefix} &7Sold &6{amount}x {item} &7for &6{total}"
  sold-all: "{prefix} &7Sold all items for &6{total}"
  nothing-to-sell: "{prefix} &7You don't have any sellable items in your inventory!"
  xp-gained: "{prefix} &7Gained &6{xp} &7XP from selling!"
  item-not-sellable: "{prefix} &7This item cannot be sold!"

# XP rewards for selling (per item sold)
xp-rewards:
  enabled: true
  # XP per money earned (multiplied by total sale value)
  multiplier: 0.05
  # Minimum XP per sale
  min-xp: 0.3
  # Maximum XP per sale
  max-xp: 7.0

