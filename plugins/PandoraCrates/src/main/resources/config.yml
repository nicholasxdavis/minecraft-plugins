# Animation Settings
animation:
  roll-duration-ticks: 60
  slow-down-ticks: 20
  particle-interval: 2
  sound-interval: 5

# Effects
effects:
  on-open:
    particles:
      enabled: true
      type: PORTAL
      count: 30
    sound:
      enabled: true
      type: "entity.player.levelup"
      volume: 1.0
      pitch: 1.2
  during-roll:
    particles:
      enabled: true
      type: CRIT
      count: 5
    sound:
      enabled: true
      type: "ui.button.click"
      volume: 0.5
      pitch: 1.0
  on-reward:
    fireworks:
      enabled: true
    particles:
      enabled: true
      type: TOTEM
      count: 50
    sound:
      enabled: true
      type: "entity.firework_rocket.blast"
      volume: 1.0
      pitch: 1.0

# Firework Colors by Rarity
fireworks:
  common:
    color: WHITE
  uncommon:
    color: GREEN
  rare:
    color: BLUE
  epic:
    color: PURPLE
  legendary:
    color: YELLOW

# Broadcast Settings
broadcast:
  enabled: true
  rarities:
    - rare
    - epic
    - legendary
  message: "{prefix} &6{player} &7opened a &6{crate} &7and won &6{reward}&7!"

# Pity System
pity:
  enabled: true
  threshold: 50
  guaranteed-rarity: rare

# Cooldown Settings
cooldown:
  enabled: true
  seconds: 3

# Auto-Save Settings (saves all player data, statistics, locations, and cooldowns)
auto-save:
  enabled: true
  interval-ticks: 6000  # Auto-save every 6000 ticks (5 minutes) - 20 ticks = 1 second

# Sound Settings
sounds:
  enter:
    enabled: true
    sound: "entity.player.levelup"
    volume: 0.7
    pitch: 1.2
  spin:
    enabled: true
    sound: "block.note_block.xylophone"
    volume: 0.7
    pitch: 1.0
  win:
    enabled: true
    sound: "entity.player.levelup"
    volume: 1.0
    pitch: 1.2
  preview:
    enabled: true
    sound: "ui.button.click"
    volume: 0.5
    pitch: 1.0
  error:
    enabled: true
    sound: "entity.villager.no"
    volume: 0.5
    pitch: 1.0

# Messages
messages:
  no-key: "{prefix} &cYou don't have a key for this crate!"
  crate-opened: "{prefix} &7You opened a &6{crate} &7crate!"
  reward-received: "{prefix} &7You received: &6{reward}&7!"
  key-given: "{prefix} &7Gave &6{amount} &6{key} &7to &6{player}&7!"
  key-received: "{prefix} &7You received &6{amount} &6{key}&7!"
  invalid-crate: "{prefix} &cInvalid crate: &6{crate}&7"
  invalid-player: "{prefix} &cPlayer not found: &6{player}&7"
  no-permission: "{prefix} &cYou don't have permission to use this command!"
  crate-preview: "{prefix} &7Previewing &6{crate} &7rewards..."

