# Pandora Banknotes
# WARNING: If your users have notes and you modify this,
#          their notes will be invalid and not registered by the plugin anymore
note:
  material: PAPER
  data: 0
  name: "&e&lBanknote"
  lore:
  - "&7Value: &6$[money]"
  - "&7Withdrawn by &e[player]"

messages:
  insufficient-funds: "&7You do not have enough money to withdraw this amount"
  insufficient-permissions: "&7You do not have enough permissions"
  inventory-full: "&7Please have a space open in your inventory to create a banknote"
  invalid-note: "&7This banknote is invalid! It has been removed from your inventory"
  invalid-number: "&7You provided an invalid number"
  note-created: "&7You created a note for &6$[money]"
  note-given: "&7You gave a note for &6$[money] &7to &e[player]"
  note-received: "&7You were given a note for &6$[money] &7by &e[player]"
  note-redeemed: "&7Banknote for &6$[money] &7has been redeemed"
  nothing-in-hand: "&7There is nothing in your hand for you to redeem"
  less-than-minimum: "&7The amount you entered is less than the minimum allowed amount of &6$[money]"
  more-than-maximum: "&7The amount you entered is more than the maximum allowed amount of &6$[money]"
  reloaded: "&7The Pandora Banknotes config.yml has been reloaded"
  target-not-found: "&7Couldn't find a player with that name"
  only-players: "&7Only players can use this command"
  
settings:
  console-name: "CONSOLE"
  minimum-float-amount: 0
  maximum-float-amount: 2
  minimum-withdraw-amount: 10.0
  maximum-withdraw-amount: 5000.0
  allow-right-click-to-deposit-notes: true
